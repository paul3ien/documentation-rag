# Paramètres du pipeline RAG.
# Source de vérité : chaque valeur est surchargeable par une variable
# d'environnement portant le même nom en MAJUSCULES.

# --- Ingestion ---
chunk_size: 200
overlap: 50

# --- Recherche hybride ---
top_k_vector: 10
top_k_bm25: 10
top_k_final: 3
rrf_k: 60

# --- Modèles ---
embedding_model: BAAI/bge-small-en-v1.5
embedding_dim: 384
ollama_model: qwen2.5:3b-instruct-q4_K_M
judge_model: qwen2.5:3b-instruct-q4_K_M

# --- Agent de recherche web ---
# Note : la clé API DeepSeek n'est JAMAIS ici (fichier versionné). Elle se met
# dans .env ou dans la variable d'environnement DEEPSEEK_API_KEY.
deepseek_model: deepseek-chat
