services:
  api:
    build: .
    image: rag-project:latest
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    environment:
      # Par défaut : Ollama tourne sur l'hôte (voir README).
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b-instruct-q4_K_M}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/raw_docs:/app/data/raw_docs
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./eval:/app/eval
      - ./mlruns:/app/mlruns
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  dashboard:
    # Même image que l'API (construite par le service `api`).
    image: rag-project:latest
    command: >-
      streamlit run dashboard/main.py
      --server.address 0.0.0.0
      --server.port 8501
      --server.headless true
    ports:
      - "8502:8501"
    volumes:
      - ./data/raw_docs:/app/data/raw_docs
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./eval:/app/eval
      - ./mlruns:/app/mlruns
    depends_on:
      - api
