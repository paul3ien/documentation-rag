apiVersion: v1
kind: Namespace
metadata:
  name: rag
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
  namespace: rag
data:
  # Ollama dans le cluster (service `ollama` du namespace `rag`).
  OLLAMA_HOST: "http://ollama:11434"
  OLLAMA_MODEL: "qwen2.5:3b-instruct-q4_K_M"
  DEEPSEEK_MODEL: "deepseek-chat"
  # Serveur MLflow distant (LXC 10.10.20.14).
  MLFLOW_TRACKING_URI: "http://10.10.20.14:5000"
# Le secret n'est PAS versionné (pour éviter d'écraser une vraie clé avec du
# vide lors d'un `kubectl apply`). Crée-le avec :
#   kubectl -n rag create secret generic rag-secrets \
#     --from-literal=DEEPSEEK_API_KEY=sk-...
# Voir k8s/examples/secret.yaml pour un modèle.
