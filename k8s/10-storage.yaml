  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-mlruns
  namespace: rag
spec:
  accessModes: [ReadWriteOnce]
