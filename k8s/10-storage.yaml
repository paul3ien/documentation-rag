apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-docs
  namespace: rag
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
