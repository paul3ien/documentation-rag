apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: rag
  labels:
    app: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Construit l'index (Qdrant + BM25) avant le démarrage de l'API.
      initContainers:
        - name: ingest
          image: rag-project:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/ingest.py"]
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "2Gi"
          envFrom:
            - configMapRef:
                name: rag-config
          volumeMounts:
            - name: docs
              mountPath: /app/data/raw_docs
            - name: storage
              mountPath: /app/storage
            - name: logs
              mountPath: /app/logs
      containers:
        - name: api
          image: rag-project:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: rag-config
            - secretRef:
                name: rag-secrets
          volumeMounts:
            - name: docs
              mountPath: /app/data/raw_docs
            - name: storage
              mountPath: /app/storage
            - name: logs
              mountPath: /app/logs
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "3Gi"
      volumes:
        - name: docs
          persistentVolumeClaim:
            claimName: rag-docs
        - name: storage
          persistentVolumeClaim:
            claimName: rag-storage
        - name: logs
          persistentVolumeClaim:
            claimName: rag-logs
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: rag
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
