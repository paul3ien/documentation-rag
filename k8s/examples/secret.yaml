# Modèle de secret — NE PAS appliquer avec `kubectl apply -f k8s/`
# (ce fichier est dans un sous-dossier, donc exclus du apply global).
#
#   kubectl -n rag create secret generic rag-secrets \
#     --from-literal=DEEPSEEK_API_KEY=sk-... \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: rag
type: Opaque
stringData:
  DEEPSEEK_API_KEY: ""
