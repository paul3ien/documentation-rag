[project]
name = "rag-project"
version = "0.1.0"
description = "RAG sur documentation technique : FastAPI + Qdrant + BM25 + Ollama"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "network: tests d'intégration nécessitant un accès réseau (désactivés par défaut)",
]
addopts = "-m 'not network'"
